<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-split · Headline top + 20% sale middle GWP $100 · Life Cykel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --lc-green:#2F5630;--lc-green-deep:#1F3D20;
  --lc-cream:#F5EFE3;--lc-amber:#E8A22B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Poppins',system-ui,sans-serif;padding:32px;display:flex;justify-content:center}

.lockup{
  position:relative;
  width:1080px;height:1350px;
  aspect-ratio:4/5;
  overflow:hidden;background:#000;
  container-type:inline-size;
}
.split-grid{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:3px;background:var(--lc-green-deep);
}
.quad{background-size:cover;position:relative}
.q1{background-image:url('images/boxer-older.jpg');background-position:center 32%}
.q2{background-image:url('images/athlete-outdoor.jpg');background-position:center 30%}
.q3{background-image:url('images/fighter-bearded.jpg');background-position:center top}
.q4{background-image:url('images/blonde-audi.jpg');background-position:center top}

.vignette-top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0) 22%);pointer-events:none;z-index:2}

.eyebrow{
  position:absolute;top:5cqw;left:5cqw;right:5cqw;
  text-align:center;color:var(--lc-cream);
  font-size:2.4cqw;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;
  text-shadow:0 1px 8px rgba(0,0,0,0.55);z-index:4;
}

.lk-mid{
  position:absolute;left:0;right:0;
  top:50%;transform:translateY(-50%);
  padding:3cqw 5cqw;
  background:linear-gradient(to bottom,rgba(31,61,32,0) 0%,rgba(31,61,32,.92) 16%,rgba(31,61,32,.92) 84%,rgba(31,61,32,0) 100%);
  color:var(--lc-cream);text-align:center;z-index:5;
}
.lk-mid .big{
  font-family:'DM Serif Display',Georgia,serif;font-style:italic;
  font-size:9.5cqw;line-height:1;letter-spacing:-.02em;
}
.lk-mid .big em{font-style:italic;color:var(--lc-amber)}
.lk-mid .sub{
  font-size:2.4cqw;font-weight:500;margin-top:1.8cqw;
  letter-spacing:.22em;text-transform:uppercase;color:#fff;
}
.lk-mid .sub b{color:var(--lc-amber);font-weight:700}

.tc{position:absolute;left:3cqw;bottom:2cqw;font-size:1.4cqw;color:#fff;opacity:.6;letter-spacing:.04em;z-index:6}
</style>
</head>
<body>
<div class="lockup">
  <div class="split-grid">
    <div class="quad q1"></div>
    <div class="quad q2"></div>
    <div class="quad q3"></div>
    <div class="quad q4"></div>
  </div>
  <div class="vignette-top"></div>
  <div class="eyebrow">· Professional Athletes Choose Lifecykel ·</div>
  <div class="lk-mid">
    <div class="big"><em>20% off</em> sitewide</div>
    <div class="sub">+ free gift with every order <b>over $100</b></div>
  </div>
  <div class="tc">*T&amp;C's apply.</div>
</div>
</body>
</html>
