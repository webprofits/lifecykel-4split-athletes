<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>M-2 · Sale top 30% + headline middle · Life Cykel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --lc-green:#2F5630;--lc-green-deep:#1f3b21;--lc-amber:#F4A623;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Poppins',system-ui,sans-serif;padding:32px;display:flex;justify-content:center}

.lockup{
  position:relative;
  width:1080px;height:1080px;
  aspect-ratio:1/1;
  overflow:hidden;background:#000;
  container-type:inline-size;
}

.split-grid{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:3px;background:var(--lc-green-deep);
}
.quad{background-size:cover;position:relative}
.q1{background-image:url('images/boxer-older-alt.jpg');background-position:center 28%}
.q2{background-image:url('images/fighter-standing.jpg');background-position:center 22%}
.q3{background-image:url('images/athlete-indoor.jpg');background-position:center top}
.q4{background-image:url('images/blonde-kitchen.jpg');background-position:center top}

.lk-top{
  position:absolute;top:0;left:0;right:0;
  padding:4cqw 5cqw 7cqw;
  background:linear-gradient(to bottom,rgba(15,30,18,.92) 0%,rgba(15,30,18,.55) 60%,rgba(0,0,0,0) 100%);
  color:#fff;z-index:4;text-align:center;
}
.lk-top .big{
  font-size:8cqw;font-weight:900;line-height:1;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 16px rgba(0,0,0,.55);
}
.lk-top .big em{font-style:normal;color:var(--lc-amber)}
.lk-top .sub{
  font-size:2.8cqw;font-weight:700;margin-top:2cqw;
  color:#fff;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;
}

.lk-mid{
  position:absolute;left:0;right:0;
  top:54%;transform:translateY(-50%);
  padding:3cqw 5cqw;
  background:linear-gradient(to bottom,rgba(15,30,18,0) 0%,rgba(15,30,18,.92) 18%,rgba(15,30,18,.92) 82%,rgba(15,30,18,0) 100%);
  color:#fff;text-align:center;z-index:5;
}
.lk-mid .h{
  font-size:7cqw;font-weight:900;line-height:1.04;letter-spacing:-.01em;
}
.lk-mid .h em{font-style:normal;color:var(--lc-amber)}

.lk-tc-bl{
  position:absolute;bottom:2cqw;left:3cqw;font-size:1.6cqw;
  color:#fff;opacity:.7;z-index:6;letter-spacing:.04em;
  text-shadow:0 1px 4px rgba(0,0,0,.55);font-weight:500;line-height:1;
}
</style>
</head>
<body>
<div class="lockup">
  <div class="split-grid">
    <div class="quad q1"></div>
    <div class="quad q2"></div>
    <div class="quad q3"></div>
    <div class="quad q4"></div>
  </div>
  <div class="lk-top">
    <div class="big"><em>30% Off</em> Sitewide</div>
    <div class="sub">+ Free gift with every order</div>
  </div>
  <div class="lk-mid">
    <div class="h">Professional Athletes<br>Choose <em>Lifecykel</em></div>
  </div>
  <div class="lk-tc-bl">*T&amp;C's apply.</div>
</div>
</body>
</html>
