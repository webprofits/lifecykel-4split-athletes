<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Masvidal · Performance Sale · 20% · v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --lc-green:#2F5630;--lc-green-deep:#1f3b21;--lc-amber:#F4A623;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Poppins',system-ui,sans-serif;padding:32px;display:flex;justify-content:center}

.lockup{
  position:relative;
  width:1080px;height:1350px;
  aspect-ratio:4/5;
  overflow:hidden;background:#000;
  container-type:inline-size;
}
.bg{position:absolute;inset:0;background-image:url('images/fighter-standing.jpg');background-size:cover;background-position:center 15%}

.lk-top{
  position:absolute;top:0;left:0;right:0;
  padding:5cqw 5cqw 8cqw;
  background:linear-gradient(to bottom,rgba(15,30,18,.9) 0%,rgba(15,30,18,.55) 60%,rgba(0,0,0,0) 100%);
  color:#fff;z-index:4;text-align:center;
}
.lk-top .big{
  font-size:8cqw;font-weight:900;line-height:1;letter-spacing:-.02em;color:#fff;
  text-shadow:0 2px 16px rgba(0,0,0,.6);
}
.lk-top .big em{font-style:normal;color:var(--lc-amber)}
.lk-top .sub{
  font-size:2.8cqw;font-weight:700;margin-top:2cqw;
  color:#fff;line-height:1.25;letter-spacing:.06em;text-transform:uppercase;
}
.lk-top .sub b{color:var(--lc-amber)}

.lk-pill-bot{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:6cqw;
  background:var(--lc-amber);color:var(--lc-green-deep);
  font-size:2.6cqw;font-weight:900;
  padding:1.8cqw 4cqw;border-radius:999px;
  letter-spacing:.16em;text-transform:uppercase;
  z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.4);
}

.lk-anchor-eyebrow{
  position:absolute;left:0;right:0;bottom:0;
  padding:3.5cqw 5cqw 4cqw;
  background:linear-gradient(to top,rgba(15,30,18,.94) 0%,rgba(15,30,18,.6) 60%,rgba(15,30,18,0) 100%);
  color:#fff;text-align:center;z-index:3;
}

.lk-tc-bl{
  position:absolute;bottom:1.6cqw;left:3cqw;font-size:1.4cqw;
  color:#fff;opacity:.65;z-index:6;letter-spacing:.04em;
  font-weight:500;line-height:1;
}
</style>
</head>
<body>
<div class="lockup">
  <div class="bg"></div>
  <div class="lk-top">
    <div class="big"><em>20% Off</em> Sitewide</div>
    <div class="sub">+ <b>Free gift</b> with every order over $100</div>
  </div>
  <div class="lk-anchor-eyebrow"></div>
  <div class="lk-pill-bot">Performance Sale · Now Live</div>
  <div class="lk-tc-bl">*T&amp;C's apply.</div>
</div>
</body>
</html>
