<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caroline Pierce · Performance Sale · 20%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --lc-green:#2F5630;--lc-green-deep:#1F3D20;
  --lc-cream:#F5EFE3;--lc-amber:#E8A22B;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Poppins',system-ui,sans-serif;padding:32px;display:flex;justify-content:center}

.lockup{
  position:relative;
  width:1080px;height:1350px;
  aspect-ratio:4/5;
  overflow:hidden;background:#000;
  container-type:inline-size;
}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 20%}
.vignette-top{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55) 0%,rgba(0,0,0,0) 28%);pointer-events:none}
.vignette-bot{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 46%,rgba(0,0,0,0.78) 100%);pointer-events:none}

.eyebrow{
  position:absolute;top:6cqw;left:5cqw;right:5cqw;
  text-align:center;color:var(--lc-cream);
  font-size:2.6cqw;font-weight:500;
  letter-spacing:.28em;text-transform:uppercase;
  text-shadow:0 1px 8px rgba(0,0,0,0.55);
}

.title{
  position:absolute;left:6cqw;right:6cqw;bottom:14cqw;
  text-align:center;
  font-family:'DM Serif Display',Georgia,serif;font-style:italic;
  font-size:11cqw;line-height:1;color:var(--lc-cream);
  letter-spacing:-.01em;
  text-shadow:0 3px 18px rgba(0,0,0,0.65);
}
.title em{font-style:italic;color:var(--lc-amber)}

.sub{
  position:absolute;left:6cqw;right:6cqw;bottom:6cqw;
  text-align:center;color:#fff;
  font-size:2.8cqw;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
  text-shadow:0 1px 6px rgba(0,0,0,0.55);
}
.sub b{color:var(--lc-amber);font-weight:700}

.tc{position:absolute;left:3cqw;bottom:2cqw;font-size:1.4cqw;color:#fff;opacity:.6;letter-spacing:.04em;font-weight:500}
</style>
</head>
<body>
<div class="lockup">
  <img class="bg" src="images/athlete-outdoor.jpg" alt="">
  <div class="vignette-top"></div>
  <div class="vignette-bot"></div>
  <div class="eyebrow">· Performance Sale Now Live ·</div>
  <div class="title">Train like<br>the <em>pros</em></div>
  <div class="sub"><b>20% off sitewide</b> · free gift over $100</div>
  <div class="tc">*T&amp;C's apply.</div>
</div>
</body>
</html>
