<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lindsay Brewer · Performance Sale · 20%</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --lc-green:#2F5630;--lc-green-deep:#1f3b21;--lc-amber:#F4A623;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Poppins',system-ui,sans-serif;padding:32px;display:flex;justify-content:center}

.lockup{
  position:relative;
  width:1080px;height:1350px;
  aspect-ratio:4/5;
  overflow:hidden;background:#000;
  container-type:inline-size;
}
.bg{position:absolute;inset:0;background-image:url('images/blonde-audi.jpg');background-size:cover;background-position:center 22%}

.lk-top{
  position:absolute;top:0;left:0;right:0;
  padding:5cqw 5cqw 9cqw;
  background:linear-gradient(to bottom,rgba(15,30,18,.86) 0%,rgba(15,30,18,.45) 60%,rgba(0,0,0,0) 100%);
  color:#fff;z-index:4;text-align:center;
}
.lk-top .eyebrow{
  font-size:2.4cqw;font-weight:800;letter-spacing:.22em;
  color:var(--lc-amber);text-transform:uppercase;margin-bottom:1.6cqw;
}
.lk-top .h{
  font-size:6.6cqw;font-weight:900;line-height:1.04;letter-spacing:-.01em;
  color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.55);
}
.lk-top .h em{font-style:normal;color:var(--lc-amber)}

.lk-anchor{
  position:absolute;left:0;right:0;bottom:0;
  padding:6cqw 5cqw 5cqw;
  background:linear-gradient(to top,rgba(15,30,18,.96) 0%,rgba(15,30,18,.82) 55%,rgba(15,30,18,0) 100%);
  color:#fff;text-align:center;z-index:4;
}
.lk-anchor .h{
  font-size:9.5cqw;font-weight:900;line-height:1;letter-spacing:-.02em;
}
.lk-anchor .h em{font-style:normal;color:var(--lc-amber)}
.lk-anchor .sub{
  font-size:3.4cqw;font-weight:700;margin-top:2.4cqw;
  color:var(--lc-amber);line-height:1.25;letter-spacing:.04em;
}
.lk-anchor .sub b{color:#fff}

.lk-tc-bl{
  position:absolute;bottom:1.6cqw;left:3cqw;font-size:1.4cqw;
  color:#fff;opacity:.65;z-index:6;letter-spacing:.04em;
  font-weight:500;line-height:1;
}
</style>
</head>
<body>
<div class="lockup">
  <div class="bg"></div>
  <div class="lk-top">
    <div class="eyebrow">· Performance Sale Now Live ·</div>
    <div class="h">Train Like<br>The <em>Pros</em></div>
  </div>
  <div class="lk-anchor">
    <div class="h"><em>20% Off</em> Sitewide</div>
    <div class="sub">+ <b>Free gift</b> with every order over $100</div>
  </div>
  <div class="lk-tc-bl">*T&amp;C's apply.</div>
</div>
</body>
</html>
